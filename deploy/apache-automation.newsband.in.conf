# Apache alternative (use this OR the nginx file - whichever serves the main website).
# Needs:    sudo a2enmod proxy proxy_http headers
# Install:  sudo cp deploy/apache-automation.newsband.in.conf /etc/apache2/sites-available/automation.newsband.in.conf
#           sudo a2ensite automation.newsband.in && sudo apachectl configtest && sudo systemctl reload apache2
#           sudo certbot --apache -d automation.newsband.in
# The main website's own vhost is not touched.

<VirtualHost *:80>
    ServerName automation.newsband.in

    ProxyPreserveHost On
    ProxyTimeout 600
    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    Header always set X-Robots-Tag "noindex, nofollow"
</VirtualHost>
