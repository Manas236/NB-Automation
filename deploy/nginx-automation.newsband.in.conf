# nginx site for automation.newsband.in -> the gunicorn process on 127.0.0.1:8001.
# Install:  sudo cp deploy/nginx-automation.newsband.in.conf /etc/nginx/sites-available/automation.newsband.in
#           sudo ln -s /etc/nginx/sites-available/automation.newsband.in /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d automation.newsband.in     # adds the HTTPS server block
# The main website's own nginx config is not touched.

server {
    listen 80;
    listen [::]:80;
    server_name automation.newsband.in;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generating several posts in one go can take minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Keep search engines out of the dashboard.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
