# Hashtag eval - ground truth. You own this file; nothing generates the labels.
#
# For each article set three lists, then flip `labelled` to true:
#   must    tags that HAVE to be suggested. A miss is a failure (recall).
#   accept  fine if suggested, not required. Keeps a good tag from being
#           counted as a mistake just because it wasn't on your must-list.
#   forbid  must NEVER be suggested. Emitting one is a failure - this is the
#           safety line (named accused, wrong civic body, off-topic noise).
#
# Anything the system emits that is on none of the three lists is reported as
# "unjudged" so you can come back and label it. Articles with labelled: false
# are skipped by the scorer entirely.
#
# The candidate menu under each article is what the CURRENT code considered -
# copy tags from it, but do not treat it as a suggestion. The most valuable
# labels are the tags it never proposed at all: write those into `must` by hand.
#
# Worked example (this article is not in the corpus - it is here to show the shape):
#
#   some-slug-from-a-crime-story:
#     headline: "Three held for assaulting shopkeeper in Turbhe"
#     dateline: Navi Mumbai
#     labelled: true
#     must:   ["#NaviMumbai", "#Crime"]
#     accept: ["#Turbhe", "#Police", "#NaviMumbaiPolice"]
#     forbid: ["#AjitSaroj"]        # never name the accused
#
# EDITORIAL RULES (owner, 2026-09-22) - apply consistently when labelling:
#   R1  Crime/law stories: individual-person hashtags are forbid - accused, victims,
#       complainants and witnesses alike - unless explicitly decided otherwise later.
#   R2  Bare or mangled surnames/name fragments are forbid as junk, on any story.
#   R3  Headline-derived phrase tags are judged per article. Decided so far:
#       accept #CigaretteRow #CivicLand #BannedMangurFish #GitaLessons #GauriIdols #Inquiry #ArmsAct;
#       forbid #ShivshahiDriver #TopPriority #OilBuyers.
#   R4  Never tag a minor, on any story.
#   R5  R1 is judged by story content, not the site's category. It also covers a business
#       named after / owned by an accused, and victims in fire/accident stories.
#   R6  Places: the specific town/node where the event happened = must; its parent city =
#       accept; neighbourhoods/areas inside it = accept (P2); landmarks/addresses = forbid.
#   R7  Named individuals outside R1: protagonist officials = accept; officials mentioned in
#       passing = forbid; private citizens = forbid; politicians linked to a failure or
#       controversy = forbid; public figures who are the story's subject = must/accept (P3).
#   R8  #Fire = actual fires only. Fire-service / rescue stories use #FireBrigade.
#   P1  forbid = false, misleading, unsafe or junk; accept = true but not essential.
#   P2  The locality where the event happened is accept (precedent #SubhashTekdi).
#   P3  Public figures who are the subject of a non-crime story are must/accept.
#
