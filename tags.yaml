# Tag catalogue for hashtags.py - the ONLY editorial knowledge in the hashtag system.
#
# One entry per hashtag. An entry lists the surface forms that EARN the tag; there are
# no inference edges between entries (Thane never implies #TMC, a politician never
# implies a party). The single exception is `parent`, which may only GENERALISE
# (#SlumRedevelopment -> #CivicIssues is safe: if the child is true so is the parent).
#
# Entry fields
#   tag            canonical hashtag, e.g. "#TMC"
#   type           person | org | place | topic
#   aliases        exact surface forms (case-insensitive unless the alias is an acronym)
#   weak_aliases   ambiguous surface forms (a bare surname) - only count as weak evidence
#   triggers       topic entries: phrases that are explicit evidence for the topic
#   weak_triggers  topic entries: single ambiguous words ("shot", "fire") - only count
#                  when the semantic similarity for that topic also agrees
#   description    topic entries: one line used for semantic retrieval (embedding)
#   parent         a more general tag to back off to under weak evidence
#   role           civic_body | police  - makes the entry a resolution target for
#                  descriptive references ("the civic body", "police"), see `descriptive`
#   sensitive      true on crime, accident and fire topics: when such a topic has explicit evidence,
#                  unknown (non-catalogue) PERSON names are never tagged
#
# `config.category_map` turns the site's editorial category into a WEAK boost for the
# listed tags. Labels not in the map (incl. "Trending" and blank) give no signal.

config:
  pad_to_five: false            # true: fill up to 5 with brand_tags when fewer clear the floor
  brand_tags: ["#Newsband"]     # always-true tags used only for padding (never scored)

  category_map:
    "Law & Crime":       ["#Crime"]
    "Civic & Politics":  ["#CivicIssues", "#Politics"]
    "Entertainment":     ["#Entertainment", "#Bollywood"]
    "Youth & Education": ["#Education"]
    "Art & Culture":     ["#Culture"]
    "Business":          ["#Business"]
    "Sports":            ["#Sports"]
    "Environment":       ["#Environment"]
    "Health":            ["#Health"]
    "Technology":        ["#Technology"]
    # the site's current labels for the same sections
    "Health & Wellness":  ["#Health"]
    "AI & Technology":    ["#Technology"]
    "Business & Finance": ["#Business"]
    "Culture":            ["#Culture"]
    "Other Sports":       ["#Sports"]

  # Descriptive references. Resolution order (first that applies):
  #   1. exactly one entry with the matching `role` is explicitly named in the article
  #   2. the dateline place is in `by_place`
  #   3. otherwise the `generic` tag (or, for `fixed`, always that tag)
  descriptive:
    civic_body:
      phrases: ["civic body", "the corporation", "civic administration", "civic officials",
                "civic chief", "civic authorities", "municipal administration",
                "municipal corporation", "municipal commissioner", "civic commissioner",
                "the civic body's", "corporation officials"]
      role: civic_body
      generic: "#CivicIssues"
      by_place:
        Thane: "#TMC"
        Kalwa: "#TMC"
        Mumbra: "#TMC"
        Diva: "#TMC"
        Kalyan: "#KDMC"
        Dombivli: "#KDMC"
        Titwala: "#KDMC"
        Navi Mumbai: "#NMMC"
        Vashi: "#NMMC"
        Nerul: "#NMMC"
        Belapur: "#NMMC"
        Airoli: "#NMMC"
        Ghansoli: "#NMMC"
        Koparkhairane: "#NMMC"
        Sanpada: "#NMMC"
        Turbhe: "#NMMC"
        Seawoods: "#NMMC"
        Mumbai: "#BMC"
        Mira Road: "#MBMC"
        Bhayandar: "#MBMC"
        Ulhasnagar: "#UMC"
        Bhiwandi: "#BNMC"
        Vasai: "#VVCMC"
        Virar: "#VVCMC"
        Nalasopara: "#VVCMC"
        Panvel: "#PanvelMC"
    police:
      phrases: ["police", "the cops", "police station", "police officials", "police personnel"]
      role: police
      generic: "#Police"
      by_place:   # commissionerate jurisdictions
        Thane: "#ThanePolice"
        Kalwa: "#ThanePolice"
        Mumbra: "#ThanePolice"
        Diva: "#ThanePolice"
        Kalyan: "#ThanePolice"
        Dombivli: "#ThanePolice"
        Ulhasnagar: "#ThanePolice"
        Ambernath: "#ThanePolice"
        Badlapur: "#ThanePolice"
        Bhiwandi: "#ThanePolice"
        Navi Mumbai: "#NaviMumbaiPolice"
        Vashi: "#NaviMumbaiPolice"
        Nerul: "#NaviMumbaiPolice"
        Belapur: "#NaviMumbaiPolice"
        Airoli: "#NaviMumbaiPolice"
        Kharghar: "#NaviMumbaiPolice"
        Panvel: "#NaviMumbaiPolice"
        Uran: "#NaviMumbaiPolice"
        Mumbai: "#MumbaiPolice"
        Mira Road: "#MBVVPolice"
        Bhayandar: "#MBVVPolice"
        Vasai: "#MBVVPolice"
        Virar: "#MBVVPolice"
        Nalasopara: "#MBVVPolice"
    state_govt:
      phrases: ["state government", "maharashtra government", "state govt", "mahayuti government"]
      fixed: "#MaharashtraGovt"

